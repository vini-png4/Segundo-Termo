<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina da Beleza</title>
    <link rel="stylesheet" href="servicos.css">
</head>
<body>
    <!-- Cabeçalho Principal -->
    <header>
        <figure>
            <img src="logo.modelo.png" alt="Logo Oficina da Beleza - Unha e Cabelo é a Arte">
        </figure>
        
        <!-- Menu de Navegação de Serviços -->
        <nav banners="Navegação por Categorias">
            <ul>
                <li><a href="#unhas">Unhas</a></li>
                <li><a href="#maquiagens">Maquiagens</a></li>
                <li><a href="#cabelos">Cabelos</a></li>
                <li><a href="#tratamentos">Tratamentos</a></li>
                <li><a href="#tinturas">Tinturas</a></li>
            </ul>
        </nav>
    </header>
    <!-- Conteúdo Principal -->
    <main>
        <!-- Banner de Destaque -->
        <section banners="Banner de Apresentação">
            <figure>
                <img src="banner-perfis-mulheres.png" alt="mulheres">
            </figure>
        </section>
        <!-- Grade de Serviços Disponíveis -->
        <section banners="Nossos Serviços">
            <header>
                <h2>Serviços em Destaque</h2>
            </header>
            <article>
                <figure>
                    <img src="maquiagem.png" alt="Mulher 1">
                    <figcaption>Beleza realçada para todas as ocasiões.</figcaption>
                </figure>
            </article>
            <article>
                <figure>
                    <img src="lavatorio.png" alt="Mulher 2">
                    <figcaption>Cuidados para cabelos mais saudáveis.</figcaption>
                </figure>
            </article>
            <article>
                <figure>
                    <img src="penteado.png" alt="3">
                    <figcaption>Cortes e penteados para renovar seu visual.</figcaption>
                </figure>
            </article>
            <article>
                <figure>
                    <img src="manicure.png" alt="4">
                    <figcaption>Esmaltação e decoração para suas unhas.</figcaption>
                </figure>
            </article>
            <article>
                <figure>
                    <img src="coloracao.png" alt="5">
                    <figcaption>Crescer para transformar seu visual.</figcaption>
                </figure>
            </article>
            <article>
                <figure>
                    <img src="cabelo-afro.png" alt="Mulher6">
                    <figcaption>Realce sua beleza e autoestima!</figcaption>
                </figure>
            </article>
        </section>
    </main>
    <!-- Rodapé da Página -->
    <footer>
        
        <!-- Mapa do Site -->
        <nav banners="Mapa do Site">
            <h3>mapa</h3>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#agendamento">Agendamento</a></li>
                <li><a href="#servicos">Serviços</a></li>
            </ul>
        </nav>
        <!-- Identidade e Redes Sociais -->
        <section banners="Identidade Corporativa">
            <figure>
                <img src="logo-rodape.png" alt="Logo Oficina da Beleza">
            </figure>
            <nav banners="Redes Sociais">
                <ul>
                    <li><a href="#" banners="Instagram">Icone Instagram</a></li>
                    <li><a href="#" banners="TikTok">Icone TikTok</a></li>
                    <li><a href="#" banners="WhatsApp">Icone WhatsApp</a></li>
                </ul>
            </nav>
        </section>
        <!-- Lista de Serviços do Rodapé -->
        <section banners="Lista Rápida de Serviços">
            <h3>Serviços</h3>
            <ul>
                <li>Cabelos</li>
                <li>Penteados</li>
                <li>Tintura</li>
                <li>Tratamentos</li>
            </ul>
        </section>
    </footer>
</body>
</html>
