
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Conheça os serviços da Oficina da Beleza: maquiagem, unhas, cortes, penteados, coloração e tratamentos capilares."
    >

    <title>Serviços | Oficina da Beleza</title>

    <link rel="stylesheet" href="servicos.css">
</head>

<body id="home">

    <!-- Cabeçalho -->
    <header class="cabecalho">

        <!-- Banner principal -->
        <section class="banner" aria-label="Apresentação da Oficina da Beleza">
            <figure class="banner__imagem">
                <img
                    src="logo.modelo.png"
                    alt="Mulheres representando a diversidade da beleza"
                >
            </figure>
        </section>

        <!-- Menu de navegação -->
        <nav class="menu" aria-label="Categorias de serviços">
            <ul class="menu__lista">
                <li><a href="#unhas">Unhas</a></li>
                <li><a href="#maquiagens">Maquiagens</a></li>
                <li><a href="#cabelos">Cabelos</a></li>
                <li><a href="#tratamentos">Tratamentos</a></li>
                <li><a href="#tinturas">Tinturas</a></li>
            </ul>
        </nav>

    </header>

    <!-- Conteúdo principal -->
    <main>

        <!-- Galeria de serviços -->
        <section class="servicos" id="servicos"
            aria-labelledby="titulo-servicos">

            <h1 id="titulo-servicos" class="servicos__titulo">
                Nossos serviços
            </h1>

            <div class="servicos__grade">

                <!-- Maquiagem -->
                <article class="servico" id="maquiagens">
                    <figure class="servico__figura">
                        <img
                            src="images.jpg"
                            alt="Maquiagem para realçar a beleza"
                            loading="lazy"
                        >
                        <figcaption>
                            Beleza realçada para todas as ocasiões.
                        </figcaption>
                    </figure>
                </article>

                <!-- Tratamentos capilares -->
                <article class="servico" id="tratamentos">
                    <figure class="servico__figura">
                        <img
                            src="dra-livia-maria-camargo-02-scaled.jpg"
                            alt="Profissional realizando tratamento capilar"
                            loading="lazy"
                        >
                        <figcaption>
                            Cuidados para cabelos mais saudáveis.
                        </figcaption>
                    </figure>
                </article>

                <!-- Cortes e penteados -->
                <article class="servico" id="cabelos">
                    <figure class="servico__figura">
                        <img
                            src="photo-1629397685944-7073f5589754.avif"
                            alt="Cabelo com corte e penteado"
                            loading="lazy"
                        >
                        <figcaption>
                            Cortes e penteados para renovar seu visual.
                        </figcaption>
                    </figure>
                </article>

                <!-- Unhas -->
                <article class="servico" id="unhas">
                    <figure class="servico__figura">
                        <img
                            src="manicure-sucesso.jpg"
                            alt="Serviço de manicure e esmaltação"
                            loading="lazy"
                        >
                        <figcaption>
                            Esmaltação e decoração para suas unhas.
                        </figcaption>
                    </figure>
                </article>

                <!-- Coloração -->
                <article class="servico" id="tinturas">
                    <figure class="servico__figura">
                        <img
                            src="unnamed.jpg"
                            alt="Coloração profissional dos cabelos"
                            loading="lazy"
                        >
                        <figcaption>
                            Cores para transformar seu visual.
                        </figcaption>
                    </figure>
                </article>

                <!-- Cabelos afro -->
                <article class="servico" id="cabelo-afro">
                    <figure class="servico__figura">
                        <img
                            src="images (1).jpg"
                            alt="Cabelo afro valorizando a beleza natural"
                            loading="lazy"
                        >
                        <figcaption>
                            Realce sua beleza e autoestima!
                        </figcaption>
                    </figure>
                </article>

            </div>
        </section>

    </main>

    <!-- Rodapé -->
    <footer class="rodape">

        <!-- Mapa do site -->
        <nav class="rodape__coluna" aria-label="Mapa do site">
            <h2 class="rodape__titulo">Site map</h2>

            <ul class="rodape__lista">
                <li><a href="#home">Home</a></li>
                <li><a href="#home">Sobre</a></li>
                <li><a href="#home">Agendamento</a></li>
                <li><a href="#servicos">Serviços</a></li>
                <li><a href="#home">Contato</a></li>
            </ul>
        </nav>

        <!-- Logo e redes sociais -->
        <section class="rodape__coluna rodape__identidade"
            aria-label="Identidade e redes sociais">

            <a class="rodape__logo" href="#home"
                aria-label="Voltar ao início">
                <img
                    src="logo-rodape.png"
                    alt="Oficina da Beleza"
                    loading="lazy"
                >
            </a>

            <nav aria-label="Redes sociais">
                <ul class="redes-sociais">
                    <li>
                        <a href="#"
                            aria-label="Instagram"
                            title="Instagram">
                            Instagram
                        </a>
                    </li>
                    <li>
                        <a href="#"
                            aria-label="TikTok"
                            title="TikTok">
                            TikTok
                        </a>
                    </li>
                    <li>
                        <a href="#"
                            aria-label="WhatsApp"
                            title="WhatsApp">
                            WhatsApp
                        </a>
                    </li>
                </ul>
            </nav>
        </section>

        <!-- Serviços do rodapé -->
        <nav class="rodape__coluna" aria-label="Serviços">
            <h2 class="rodape__titulo">Serviços</h2>

            <ul class="rodape__lista">
                <li><a href="#cabelos">Cabelos</a></li>
                <li><a href="#cabelos">Penteados</a></li>
                <li><a href="#tinturas">Tinturas</a></li>
                <li><a href="#tratamentos">Tratamentos</a></li>
            </ul>
        </nav>

    </footer>

</body>
</html>
