<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="imagem.css">
    <title>Revisão de Imagens e Videos</title>
</head>
<body>
    <h1>Trabalhando com imagens</h1>
    <h2>imagem responsiva basica</h2>
        <figure class="resp-bas">
            <img src="goldentrio.webp" alt="Imagem 1">
        </figure>

    <h2>Imagem com Recorte</h2>
        <figure class="img-rec">
            <img src="goldentrio1.webp" alt="Imagem 2">
        </figure>

    <h2>Imagem em formato de cards</h2>
        <figure class="img-card">
            <img src="coruja.jpg" alt="Imagem 3">
        </figure>

    <h2>Personalização</h2>
        <figure class="pers-img">
            <img src="Draco_malfoy.jpg" alt="Imagem 4">
        </figure>

    <h2>Imagens em Grid</h2>
        <section class="sec-grid">
            <article class="img-grid">
                <img src="hagrid.webp" alt="Imagem 5">
            </article>
            <article class="img-grid">
                <img src="Luna.jpg" alt="Imagem 6">
            </article>
            <article class="img-grid">
                <img src="Snape.webp" alt="Imagem 7">
            </article>
        </section>
        
    <video controls 
    src="videoplayback.mp4" controls poster="voldereharry.webp">

    </video>




</body>
</html>
